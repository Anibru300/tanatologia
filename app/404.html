<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOMOS-CALMA</title>
    <script>
      // GitHub Pages SPA redirect para HashRouter.
      // Ejemplo: /app/login -> /app/#/login
      var segment = 'app';
      var l = window.location;
      var path = l.pathname.replace(new RegExp('^/' + segment + '/?'), '');
      l.replace('/' + segment + '/#' + (path ? '/' + path : '') + l.search + l.hash);
    </script>
  </head>
  <body></body>
</html>
