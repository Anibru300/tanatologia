    <!-- Google Analytics 4 (G-CJ0QQ9JY27) con tracking de rutas del HashRouter -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CJ0QQ9JY27"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-CJ0QQ9JY27');

      /* Analítica first-party (panel Admin > Flujo de la página): beacon hacia track-view */
      (function () {
        try {
          var STORAGE_KEY = 'sc_analytics_sid';
          var sid = localStorage.getItem(STORAGE_KEY);
          if (!sid) {
            sid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              var r = Math.random() * 16 | 0;
              return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            try { localStorage.setItem(STORAGE_KEY, sid); } catch (e) { /* modo privado */ }
          }
          var sendView = function () {
            try {
              fetch('https://qjwebikgrqtotqfipeqt.supabase.co/functions/v1/track-view', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  path: window.location.pathname + window.location.hash,
                  referrer: document.referrer || null,
                  sessionKey: sid,
                  source: 'app',
                  timezone: (window.Intl && Intl.DateTimeFormat().resolvedOptions().timeZone) || null
                }),
                keepalive: true
              }).catch(function () { /* offline: se omite */ });
            } catch (e) { /* nunca romper la app */ }
          };
          window.addEventListener('hashchange', sendView);
          sendView();
        } catch (e) { /* sin localStorage: omitir */ }
      })();
      window.addEventListener('hashchange', function () {
        gtag('event', 'page_view', {
          page_path: window.location.pathname + window.location.hash,
          page_location: window.location.href,
        });
      });
    </script>
    <script>
      // HashRouter recovery helper: Supabase envía recovery como query params
      // (p. ej. /app/?token=...&type=recovery). Movemos esos params
      // al hash antes de que React Router tome el control.
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('type') === 'recovery') {
          window.location.hash = '#/actualizar-contrasena?' + params.toString();
        }
      })();
    </script>
