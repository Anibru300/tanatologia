<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Fondo base cálido -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F2" />
      <stop offset="45%" stop-color="#F2EEE8" />
      <stop offset="100%" stop-color="#EDE8E1" />
    </linearGradient>

    <!-- Bruma verde -->
    <radialGradient id="greenMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BAE7A" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8BAE7A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8BAE7A" stop-opacity="0" />
    </radialGradient>

    <!-- Bruma azul -->
    <radialGradient id="blueMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A9AA8" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#7A9AA8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#7A9AA8" stop-opacity="0" />
    </radialGradient>

    <!-- Bruma terracota -->
    <radialGradient id="terracottaMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A28E" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C9A28E" stop-opacity="0" />
    </radialGradient>

    <!-- Colinas -->
    <linearGradient id="hillGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BAE7A" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8BAE7A" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="hillBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A9AA8" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#7A9AA8" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="hillTerracotta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A28E" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#C9A28E" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1440" height="900" fill="url(#baseGradient)" />

  <!-- Brumas animadas que se mueven horizontalmente -->
  <g opacity="0.8">
    <circle cx="-200" cy="200" r="350" fill="url(#greenMist)">
      <animate attributeName="cx" values="-200;1640;-200" dur="60s" repeatCount="indefinite" />
      <animate attributeName="cy" values="200;250;200" dur="60s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="20s" repeatCount="indefinite" />
    </circle>

    <circle cx="1640" cy="500" r="300" fill="url(#blueMist)">
      <animate attributeName="cx" values="1640;-200;1640" dur="70s" repeatCount="indefinite" />
      <animate attributeName="cy" values="500;450;500" dur="70s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="25s" repeatCount="indefinite" />
    </circle>

    <circle cx="700" cy="800" r="400" fill="url(#terracottaMist)">
      <animate attributeName="cx" values="700;900;700" dur="50s" repeatCount="indefinite" />
      <animate attributeName="cy" values="800;750;800" dur="50s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="18s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Colinas con movimiento sutil -->
  <g opacity="0.7">
    <path d="M0,380 C200,320 400,420 600,360 C800,300 1000,400 1200,340 C1320,310 1380,350 1440,330 L1440,900 L0,900 Z" fill="url(#hillTerracotta)">
      <animate attributeName="d" values="M0,380 C200,320 400,420 600,360 C800,300 1000,400 1200,340 C1320,310 1380,350 1440,330 L1440,900 L0,900 Z;M0,370 C200,330 400,410 600,350 C800,310 1000,390 1200,350 C1320,320 1380,340 1440,320 L1440,900 L0,900 Z;M0,380 C200,320 400,420 600,360 C800,300 1000,400 1200,340 C1320,310 1380,350 1440,330 L1440,900 L0,900 Z" dur="30s" repeatCount="indefinite" />
    </path>

    <path d="M0,480 C240,420 480,520 720,460 C960,400 1200,500 1440,440 L1440,900 L0,900 Z" fill="url(#hillBlue)">
      <animate attributeName="d" values="M0,480 C240,420 480,520 720,460 C960,400 1200,500 1440,440 L1440,900 L0,900 Z;M0,470 C240,430 480,510 720,450 C960,410 1200,490 1440,430 L1440,900 L0,900 Z;M0,480 C240,420 480,520 720,460 C960,400 1200,500 1440,440 L1440,900 L0,900 Z" dur="35s" repeatCount="indefinite" />
    </path>

    <path d="M0,580 C180,520 360,600 540,560 C720,520 900,600 1080,560 C1260,520 1380,560 1440,550 L1440,900 L0,900 Z" fill="url(#hillGreen)">
      <animate attributeName="d" values="M0,580 C180,520 360,600 540,560 C720,520 900,600 1080,560 C1260,520 1380,560 1440,550 L1440,900 L0,900 Z;M0,570 C180,530 360,590 540,550 C720,530 900,590 1080,550 C1260,530 1380,550 1440,540 L1440,900 L0,900 Z;M0,580 C180,520 360,600 540,560 C720,520 900,600 1080,560 C1260,520 1380,560 1440,550 L1440,900 L0,900 Z" dur="40s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Elementos orgánicos flotantes en primer plano -->
  <g opacity="0.15">
    <ellipse cx="100" cy="820" rx="120" ry="80" fill="#8BAE7A">
      <animate attributeName="cy" values="820;810;820" dur="8s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="240" cy="860" rx="90" ry="60" fill="#8BAE7A">
      <animate attributeName="cy" values="860;870;860" dur="10s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1300" cy="830" rx="140" ry="90" fill="#8BAE7A">
      <animate attributeName="cy" values="830;820;830" dur="9s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1420" cy="870" rx="80" ry="55" fill="#8BAE7A">
      <animate attributeName="cy" values="870;880;870" dur="11s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Pétalos/hojas flotantes sutiles -->
  <g opacity="0.12" fill="#8BAE7A">
    <circle cx="200" cy="100" r="8">
      <animate attributeName="cy" values="100;950" dur="25s" repeatCount="indefinite" />
      <animate attributeName="cx" values="200;240;200" dur="25s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.2;0" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="50" r="6">
      <animate attributeName="cy" values="50;950" dur="32s" repeatCount="indefinite" />
      <animate attributeName="cx" values="800;760;800" dur="32s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.15;0" dur="32s" repeatCount="indefinite" />
    </circle>
    <circle cx="1200" cy="150" r="7">
      <animate attributeName="cy" values="150;950" dur="28s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1200;1240;1200" dur="28s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.18;0" dur="28s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="80" r="5">
      <animate attributeName="cy" values="80;950" dur="35s" repeatCount="indefinite" />
      <animate attributeName="cx" values="400;360;400" dur="35s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.12;0" dur="35s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
