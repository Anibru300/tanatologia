# Build y calidad de la app React (platform/web) y publicación en /app
# GitHub Pages publica la raíz de main; este workflow mantiene /app sincronizado.
# En pull requests solo valida (lint + tests + build), sin tocar /app.
name: Build app React → /app

on:
  push:
    branches: [main]
    paths:
      - 'platform/web/**'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    paths:
      - 'platform/web/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      - name: Instalar dependencias
        working-directory: platform/web
        run: npm ci

      - name: Lint (oxlint)
        working-directory: platform/web
        run: npm run lint

      - name: Tests (Vitest)
        working-directory: platform/web
        run: npm run test

      - name: Build (tsc + vite)
        working-directory: platform/web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_JITSI_DOMAIN: ${{ vars.VITE_JITSI_DOMAIN || 'meet.jit.si' }}

      - name: Subir build como artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: platform/web/dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar build
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: platform/web/dist

      - name: Copiar build a /app
        run: |
          rm -rf app
          cp -r platform/web/dist app

      - name: Commit y push del build
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: build automático de /app'
