# Dependabot: mantiene al día las dependencias de la app y de los workflows.
# Las PRs que abre pasan por el pipeline (lint + tests + build) antes de merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /platform/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencias

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - ci
