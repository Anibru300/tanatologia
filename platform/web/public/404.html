<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOMOS-CALMA</title>
    <script>
      // GitHub Pages SPA redirect para HashRouter.
      // Ejemplo: /tanatologia/app/login -> /tanatologia/app/#/login
      var segment = 'tanatologia/app';
      var l = window.location;
      var path = l.pathname.replace(new RegExp('^/' + segment + '/?'), '');
      l.replace('/' + segment + '/#' + (path ? '/' + path : '') + l.search + l.hash);
    </script>
  </head>
  <body></body>
</html>
