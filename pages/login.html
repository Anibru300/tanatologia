<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/tanatologia/app/login">
    <meta name="description" content="Inicia sesión en SOMOS-CALMA, tu espacio seguro para sanar y encontrar alivio.">
    <title>Iniciar Sesión | SOMOS-CALMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="page-with-bg">
    <div id="header-component"></div>

    <main>
        <section class="section section--alt" style="min-height: 70vh; display: flex; align-items: center;">
            <div class="container">
                <div style="max-width: 420px; margin: 0 auto; background: var(--color-surface); padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--color-border); text-align: center;">
                    <span class="section__eyebrow">Bienvenido de vuelta</span>
                    <h1 style="font-size: 1.75rem; margin-top: 0.5rem;">Iniciar sesión</h1>
                    <p style="color: var(--color-text-light); margin-bottom: 1.5rem;">Te estamos redirigiendo a la plataforma segura de SOMOS-CALMA.</p>
                    <a href="/tanatologia/app/login" class="btn btn--primary" style="width: 100%;">Iniciar sesión en la plataforma</a>
                    <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-light);">
                        Si no te redirige automáticamente, haz clic en el botón de arriba.
                    </p>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-component"></div>

    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
